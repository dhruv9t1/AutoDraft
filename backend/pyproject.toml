[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodraft-backend"
version = "1.3.0"
description = "Python/FastAPI backend for the AutoDraft Microsoft Word add-in"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.118.0",
  "uvicorn[standard]==0.37.0",
  "httpx==0.28.1",
  "asyncpg==0.30.0",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "pypdf==6.1.1",
  "Pillow==11.3.0",
  "PyJWT[crypto]==2.10.1",
  "cryptography==46.0.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "scripts*", "tests*"]
